name: Validate OpenATV 8 installer
on:
  push:
    paths:
      - 'install.sh'
      - 'cineview-smart-install.sh'
      - 'installer/openatv_compat.py'
      - 'installer/parts/0000-header.sh'
      - '.github/workflows/validate-openatv.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Simulate OpenATV 8 install and validate native contracts
        shell: bash
        run: |
          set -euo pipefail
          sudo mkdir -p /etc/enigma2 /usr/local/bin
          sudo mkdir -p /usr/lib/enigma2/python/Components/Renderer
          sudo mkdir -p /usr/lib/enigma2/python/Components/Converter
          sudo mkdir -p /usr/lib/enigma2/python/Components/Sources
          printf '%s\n' \
            'box_type=vuduo4kse' \
            'version=8.0.0-beta' \
            'build=20260917' \
            'comment=openATV' \
            'oever=OE-Alliance 6.0' \
            'distro=openatv' \
            'arch=cortexa15hf-neon-vfpv4' | sudo tee /etc/image-version >/dev/null
          printf '%s\n' 'Welcome to openATV 8.0.0-beta' | sudo tee /etc/issue >/dev/null
          sudo tee /etc/enigma2/settings >/dev/null <<'EOF'
          config.usage.pluginListLayout=0
          config.plugins.cineview.theme=navy
          config.plugins.cineview.poster_infobar=True
          config.plugins.cineview.poster_second=True
          config.plugins.cineview.poster_channels=True
          config.plugins.cineview.weatherprovider=oa
          config.plugins.cineview.timeformat=24
          EOF

          for p in \
            /usr/lib/enigma2/python/Components/Renderer/RunningText.py \
            /usr/lib/enigma2/python/Components/Converter/PliExtraInfo.py \
            /usr/lib/enigma2/python/Components/Converter/ServiceOrbitalPosition.py \
            /usr/lib/enigma2/python/Components/Sources/OAWeather.py \
            /usr/lib/enigma2/python/Components/Converter/OAWeather.py; do
            sudo mkdir -p "$(dirname "$p")"
            printf '# simulated OpenATV component\n' | sudo tee "$p" >/dev/null
          done
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/bitrate >/dev/null
          sudo chmod 755 /usr/local/bin/bitrate

          cat >/tmp/opkg <<'EOF'
          #!/bin/sh
          echo "$*" >> /tmp/opkg-calls.log
          pkg=""
          for a in "$@"; do
            case "$a" in /tmp/cineview-fhd-*.ipk) pkg="$a";; esac
          done
          [ -n "$pkg" ] || exit 0
          if echo " $* " | grep -q " --force-reinstall "; then
            rm -rf /tmp/ipkx && mkdir -p /tmp/ipkx
            cd /tmp/ipkx || exit 1
            ar p "$pkg" data.tar.gz > data.tar.gz || exit 1
            sudo tar -xzf data.tar.gz -C / || exit 1
            touch /tmp/openatv-data-installed
            exit 0
          fi
          echo "Refusing first same-version install (simulated OpenATV)" >&2
          exit 1
          EOF
          chmod +x /tmp/opkg
          sudo cp /tmp/opkg /usr/local/bin/opkg

          grep -F 'OpenATV 8 installation is paused until receiver-safe validation is approved.' install.sh
          cp cineview-smart-install.sh /tmp/cineview-openatv-candidate.sh
          chmod +x /tmp/cineview-openatv-candidate.sh
          sudo env PATH="/usr/local/bin:/usr/bin:/bin" sh /tmp/cineview-openatv-candidate.sh --no-restart 2>&1 | tee /tmp/openatv-install.log

          test -f /tmp/openatv-data-installed
          grep -F 'OpenATV detected' /tmp/openatv-install.log
          grep -F 'dedicated CineView FHD OpenATV screen contracts' /tmp/openatv-install.log
          grep -F 'OpenATV PluginBrowser list/grid, EventView, SecondInfoBar and EPG layouts adapted' /tmp/openatv-install.log
          if grep -Fq 'OpenViX detected' /tmp/openatv-install.log; then
            echo "OpenViX adapter incorrectly ran on OpenATV" >&2
            exit 10
          fi
          if grep -Fq 'OpenBH detected' /tmp/openatv-install.log; then
            echo "OpenBH adapter incorrectly ran on OpenATV" >&2
            exit 11
          fi

          python3 - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          p=Path('/usr/share/enigma2/CineView_FHD/skin.xml')
          assert p.exists(), p
          s=p.read_text(errors='ignore')
          ET.fromstring(s)

          def one(name):
              m=re.findall(r'(?s)<screen\b(?=[^>]*\bname=["\']'+re.escape(name)+r'["\'])[^>]*>.*?</screen>',s)
              assert len(m)==1,(name,len(m))
              return m[0]

          pb=one('PluginBrowser')
          pbl=one('PluginBrowserList')
          pbg=one('PluginBrowserGrid')
          assert 'source="pluginList"' in pb and 'source="pluginGrid"' in pb
          assert 'conditional="pluginList"' in pb and 'conditional="pluginGrid"' in pb
          assert 'source="pluginList"' in pbl
          assert 'source="pluginGrid"' in pbg
          assert 'listOrientation="grid"' in pbg
          assert 'source="list"' not in pb
          assert 'source="list"' not in pbl
          assert 'BT_SCALE' in pb and 'BT_SCALE' in pbl and 'BT_SCALE' in pbg
          assert 'BT_KEEP_ASPECT_RATIO' not in pb+pbl+pbg

          ev=one('EventView')
          evs=one('EventViewSimple')
          iev=one('InfoBarEventView')
          # EventView is shared by EventViewEPGSelect and EventViewMovieEvent.
          # Only use components common to both to avoid a skin crash.
          for x in ('name="epg_description"','name="datetime"','name="duration"','name="channel"',
                    'source="key_red"','source="key_green"','source="key_yellow"','source="key_blue"'):
              assert x in ev,('EventView',x)
          assert 'name="FullDescription"' not in ev
          assert 'source="Event"' not in ev
          assert 'name="red"' not in ev and 'name="green"' not in ev
          for block in (evs,iev):
              assert 'name="FullDescription"' in block
              assert 'render="CineViewPosterX"' in block

          si=one('SecondInfoBar')
          sie=one('SecondInfoBarECM')
          for block in (si,sie):
              assert 'name="FullDescription"' in block
              assert 'name="channel"' in block

          epg=one('EPGSelection')
          mepg=one('EPGSelectionMulti')
          quick=one('QuickEPG')
          graph=one('GraphicalEPG')
          graphpig=one('GraphicalEPGPIG')
          ibgraph=one('GraphicalInfoBarEPG')
          assert 'name="number"' in epg and 'name="list"' in epg
          assert 'name="bouquetlist"' in mepg and 'name="date"' in mepg
          assert 'source="Service"' in quick and 'name="list"' in quick
          assert 'name="timeline_text"' in graph and 'name="timeline_now"' in graph
          assert 'render="Pig"' in graphpig
          assert 'name="timeline_text"' in ibgraph

          assert 'render="PosterX"' not in s
          assert s.count('render="CineViewPosterX"') >= 7
          assert '<screen name="DeliteGreenPanel"' not in s
          print('OPENATV_ACTIVE_XML_OK')
          print('OPENATV_CINEVIEWPOSTERX_REFS',s.count('render="CineViewPosterX"'))
          PY

          grep -F 'config.skin.primary_skin=CineView_FHD/skin.xml' /etc/enigma2/settings
          grep -F -- '--force-reinstall' /tmp/opkg-calls.log
          echo OPENATV_INSTALLER_END_TO_END_PASS

      - name: Validate against pinned OpenATV 8 upstream screen contracts
        shell: bash
        run: |
          set -euo pipefail
          SHA=e041845ea5feb7f0636568ef408004992ef75ca2
          BASE="https://raw.githubusercontent.com/openatv/enigma2/$SHA/lib/python/Screens"
          curl -fsSL "$BASE/PluginBrowser.py" -o /tmp/atv-PluginBrowser.py
          curl -fsSL "$BASE/EventView.py" -o /tmp/atv-EventView.py
          curl -fsSL "$BASE/InfoBarGenerics.py" -o /tmp/atv-InfoBarGenerics.py
          curl -fsSL "$BASE/EpgSelection.py" -o /tmp/atv-EpgSelection.py
          curl -fsSL "$BASE/SessionGlobals.py" -o /tmp/atv-SessionGlobals.py
          python3 - <<'PY'
          from pathlib import Path
          pb=Path('/tmp/atv-PluginBrowser.py').read_text()
          ev=Path('/tmp/atv-EventView.py').read_text()
          ib=Path('/tmp/atv-InfoBarGenerics.py').read_text()
          epg=Path('/tmp/atv-EpgSelection.py').read_text()
          sg=Path('/tmp/atv-SessionGlobals.py').read_text()

          assert 'mandatoryWidgets=[self.layout]' in pb
          assert 'self.skinName = ["PluginBrowserList" if config.usage.pluginListLayout.value == PLUGIN_LIST else "PluginBrowserGrid", "PluginBrowser"]' in pb
          assert 'source="pluginList"' in pb and 'source="pluginGrid"' in pb
          assert 'flags=BT_SCALE' in pb

          assert 'class EventViewEPGSelect' in ev
          assert 'self.skinName = ["EventView"]' in ev
          assert 'class EventViewMovieEvent' in ev
          movie=ev.split('class EventViewMovieEvent',1)[1].split('def showEventViewCallback',1)[0]
          assert 'self.skinName = "EventView"' in movie
          assert 'self["epg_description"]' in movie
          assert 'self["FullDescription"]' not in movie
          assert 'self["Event"]' not in movie

          assert 'class SecondInfoBar' in ib
          second=ib.split('class SecondInfoBar',1)[1].split('class InfoBarShowHide',1)[0]
          for x in ('self["epg_description"]','self["FullDescription"]','self["channel"]',
                    'self["key_red"]','self["key_green"]','self["key_yellow"]','self["key_blue"]'):
              assert x in second,x

          assert 'self["Event_Now"] = EventInfo(session.nav, EventInfo.NOW)' in sg

          for x in ('self.skinName = "QuickEPG"','self.skinName = "GraphicalEPG"',
                    'self.skinName = "GraphicalEPGPIG"','self.skinName = "GraphicalInfoBarEPG"',
                    'self.skinName = "EPGSelectionMulti"'):
              assert x in epg,x
          print('OPENATV_UPSTREAM_CONTRACTS_OK')
          PY

      - name: Verify OpenATV keeps theme-owned SecondInfoBar color
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/cv-compat-unit /tmp/cv-components
          mkdir -p /tmp/cv-compat-unit /tmp/cv-components/Components/Renderer /tmp/cv-components/Components/Converter
          printf '%s\n' '<skin><colors><color name="steSecondInfoBG" value="#AA112233"/></colors></skin>' >/tmp/cv-compat-unit/skin.xml
          printf '# present\n' >/tmp/cv-components/Components/Renderer/RunningText.py
          printf '# present\n' >/tmp/cv-components/Components/Converter/PliExtraInfo.py
          printf '# present\n' >/tmp/cv-components/Components/Converter/TransponderInfo.py
          printf '# present\n' >/tmp/cv-components/Components/Converter/ServiceOrbitalPosition.py
          printf '%s\n' 'version=8.0.0-beta' 'distro=openatv' | sudo tee /etc/image-version >/dev/null
          python3 installer/compat.py /tmp/cv-compat-unit /tmp/cv-components /tmp/cv-compat-report.json
          grep -F 'value="#AA112233"' /tmp/cv-compat-unit/skin.xml
          if grep -Fq '#B8101214' /tmp/cv-compat-unit/skin.xml; then
            echo "OpenATV SecondInfoBar color was incorrectly forced" >&2
            exit 30
          fi
          echo OPENATV_SECONDINFO_THEME_COLOR_PRESERVED
