name: Validate CineView OpenATV 7.4-8.0 release
on:
  push:
    paths:
      - 'install.sh'
      - 'cineview-smart-install.sh'
      - 'installer/openatv_compat.py'
      - 'installer/CineViewPosterX.py'
      - 'installer/parts/**'
      - '.github/workflows/validate-openatv.yml'
  pull_request:
    paths:
      - 'install.sh'
      - 'cineview-smart-install.sh'
      - 'installer/openatv_compat.py'
      - 'installer/CineViewPosterX.py'
      - 'installer/parts/**'
      - '.github/workflows/validate-openatv.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate release payload and OpenATV contracts
        shell: bash
        run: |
          set -euo pipefail
          sh -n install.sh
          sh -n installer/parts/0000-header.sh
          python3 -m py_compile installer/openatv_compat.py
          python3 -m py_compile installer/CineViewPosterX.py

          grep -q '7.4.*7.5.*7.6.*8.0' install.sh
          grep -q '7.4.*7.5.*7.6.*8.0' installer/parts/0000-header.sh
          grep -q 'CONTROL/preinst' installer/parts/0000-header.sh
          grep -q 'Version: 2.1.0' installer/parts/0000-header.sh

          cat installer/parts/*.b64 | base64 -d > /tmp/cv-payload.tar.gz
          tar -tzf /tmp/cv-payload.tar.gz >/dev/null
          rm -rf /tmp/cvstage
          mkdir -p /tmp/cvstage
          tar -xzf /tmp/cv-payload.tar.gz -C /tmp/cvstage

          cp -f installer/openatv_compat.py /tmp/cvstage/usr/lib/enigma2/python/Plugins/Extensions/CineViewControl/openatv_compat.py
          cp -f installer/CineViewPosterX.py /tmp/cvstage/usr/lib/enigma2/python/Components/Renderer/CineViewPosterX.py

          python3 /tmp/cvstage/usr/lib/enigma2/python/Plugins/Extensions/CineViewControl/openatv_compat.py /tmp/cvstage/usr/share/enigma2/CineView_FHD >/tmp/openatv-patch-count.txt
          test "$(cat /tmp/openatv-patch-count.txt)" -gt 0

          python3 - <<'PY'
          from pathlib import Path
          import collections, re, xml.etree.ElementTree as ET
          root=Path('/tmp/cvstage/usr/share/enigma2/CineView_FHD')
          files=sorted(root.glob('skin*.xml'))
          assert files
          for p in files:
              s=p.read_text(errors='ignore')
              ET.fromstring(s)
              names=re.findall(r'<screen name="([^"]+)"',s)
              dup=[n for n,c in collections.Counter(names).items() if c>1]
              assert not dup,(p.name,dup)
              assert 'render="PosterX"' not in s
              assert 'ServiceInfo">IsSDAndWidescreen' not in s
              assert 'ServiceInfo">IsSDAndNotWidescreen' not in s
          s=(root/'skin.xml').read_text(errors='ignore')
          assert 'size=(185, 80)' in s
          assert 'flags=BT_SCALE)' in s
          assert 'position="45,110" size="1830,800"' in s
          assert 'position="45,90" size="640,820"' in s
          assert 'position="735,90" size="640,820"' in s
          assert 'position="1420,92" size="455,256"' in s
          assert '<screen name="SkinSelection"' in s
          assert 'itemHeight="64" font="Regular;30"' in s
          print('XML_AND_UI_CONTRACTS_OK',len(files))
          PY

          for ref in 7.4 7.5 7.6 8.0; do
            curl -fsSL "https://raw.githubusercontent.com/openatv/enigma2/$ref/lib/python/Screens/PluginBrowser.py" -o "/tmp/PluginBrowser-$ref.py"
            grep -q 'pluginList' "/tmp/PluginBrowser-$ref.py"
            grep -q 'pluginGrid' "/tmp/PluginBrowser-$ref.py"
            grep -q 'PluginBrowserList' "/tmp/PluginBrowser-$ref.py"
            grep -q 'PluginBrowserGrid' "/tmp/PluginBrowser-$ref.py"
            grep -q 'quickselect' "/tmp/PluginBrowser-$ref.py"
            grep -q 'description' "/tmp/PluginBrowser-$ref.py"
          done
          echo OPENATV_74_75_76_80_CONTRACTS_OK
