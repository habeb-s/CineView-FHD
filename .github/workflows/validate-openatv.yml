name: Validate OpenATV 8 installer
on:
  push:
    paths:
      - 'install.sh'
      - 'cineview-smart-install.sh'
      - 'installer/openatv_compat.py'
      - 'installer/parts/0000-header.sh'
      - '.github/workflows/validate-openatv.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 40
      - name: Validate published OpenATV 8 rollback payload
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile installer/openatv_compat.py

          RAW_SHA="$(sed -n 's|^RAW="https://raw.githubusercontent.com/habeb-s/CineView-FHD/\([0-9a-f]\{40\}\)"$|\1|p' install.sh)"
          test -n "$RAW_SHA"
          git cat-file -e "$RAW_SHA:cineview-smart-install.sh"
          git show "$RAW_SHA:cineview-smart-install.sh" > /tmp/cineview-smart-install.sh

          LINE="$(awk '/^__CINEVIEW_PAYLOAD_BELOW__$/{print NR+1; exit}' /tmp/cineview-smart-install.sh)"
          test -n "$LINE"
          tail -n +"$LINE" /tmp/cineview-smart-install.sh | base64 -d > /tmp/cineview-payload.tar.gz
          tar -tzf /tmp/cineview-payload.tar.gz >/dev/null
          tar -xOf /tmp/cineview-payload.tar.gz ./usr/lib/enigma2/python/Plugins/Extensions/CineViewControl/openatv_compat.py > /tmp/published-openatv.py
          cmp installer/openatv_compat.py /tmp/published-openatv.py
          python3 -m py_compile /tmp/published-openatv.py

          rm -rf /tmp/cvskin
          mkdir -p /tmp/cvskin
          cat > /tmp/cvskin/skin.xml <<'EOF'
          <skin>
            <screen name="InfoBar" position="0,700" size="1920,380"><widget name="legacy_infobar" position="0,0" size="100,50"/></screen>
            <screen name="ChannelSelection" position="center,center" size="1800,900"><widget name="legacy_channel_list" position="0,0" size="100,50"/></screen>
            <screen name="MessageBox" position="center,center" size="600,500">
              <widget source="session.CurrentService" render="Label" position="0,0" size="100,40">
                <convert type="ServiceInfo">IsSDAndWidescreen</convert>
              </widget>
              <applet type="onLayoutFinish">if self.timerRunning:
                  pass</applet>
            </screen>
          </skin>
          EOF

          python3 /tmp/published-openatv.py /tmp/cvskin >/tmp/openatv-adapter.log
          grep -Fx '1' /tmp/openatv-adapter.log

          python3 - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          s=Path('/tmp/cvskin/skin.xml').read_text()
          ET.fromstring(s)

          def one(name):
              m=re.findall(r'(?s)<screen\b(?=[^>]*\bname=["\']'+re.escape(name)+r'["\'])[^>]*>.*?</screen>',s)
              assert len(m)==1,(name,len(m))
              return m[0]

          # These core native CineView screens must be preserved and not replaced
          # by the later experimental full-screen OpenATV redesign.
          assert 'legacy_infobar' in one('InfoBar')
          assert 'legacy_channel_list' in one('ChannelSelection')

          for name in (
              'PluginBrowser','PluginBrowserList','PluginBrowserGrid',
              'QuickMenu','EventView','EventViewSimple','InfoBarEventView',
              'SecondInfoBar','SecondInfoBarECM',
              'EPGSelection','EPGSelectionMulti','QuickEPG',
              'GraphicalEPG','GraphicalEPGPIG','GraphicalInfoBarEPG',
              'EPGvertical','EPGverticalPIG','MessageBox','MessageBoxModal'
          ):
              one(name)

          assert 'source="pluginList"' in one('PluginBrowserList')
          assert 'source="pluginGrid"' in one('PluginBrowserGrid')
          assert 'name="epg_description"' in one('EventView')
          assert 'name="epg_description"' in one('SecondInfoBar')
          assert '<applet' not in one('MessageBox')
          assert 'if self.timerRunning:' not in s
          assert 'ServiceInfo">IsSDAndWidescreen' not in s
          assert 'render="PosterX"' not in s
          print('OPENATV8_ROLLBACK_CONTRACTS_OK')
          PY
