name: Build CineView smart installer
on:
  push:
    paths:
      - 'installer/parts/**'
      - 'installer/CineViewPosterX.py'
      - 'installer/openbh_compat.py'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild and validate installer
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/cvstage
          mkdir -p /tmp/cvstage
          cat installer/parts/*.b64 | base64 -d > /tmp/cineview-payload-original.tar.gz
          tar -xzf /tmp/cineview-payload-original.tar.gz -C /tmp/cvstage
          mkdir -p /tmp/cvstage/usr/lib/enigma2/python/Components/Renderer
          cp -f installer/CineViewPosterX.py /tmp/cvstage/usr/lib/enigma2/python/Components/Renderer/CineViewPosterX.py
          cp -f installer/openbh_compat.py /tmp/cvstage/usr/lib/enigma2/python/Plugins/Extensions/CineViewControl/openbh_compat.py
          python3 -m py_compile /tmp/cvstage/usr/lib/enigma2/python/Components/Renderer/CineViewPosterX.py
          python3 -m py_compile /tmp/cvstage/usr/lib/enigma2/python/Plugins/Extensions/CineViewControl/openbh_compat.py
          rm -rf /tmp/cvstage/usr/lib/enigma2/python/Components/Renderer/__pycache__
          rm -rf /tmp/cvstage/usr/lib/enigma2/python/Plugins/Extensions/CineViewControl/__pycache__
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('/tmp/cvstage/usr/lib/enigma2/python/Plugins/Extensions/CineViewControl/smartdeps.sh')
          s=p.read_text()
          s,n=re.subn(
              r'# PosterX: prefer a dedicated feed package\. Never force-install unrelated packages\..*?\nfi\n',
              "# PosterX: CineView ships CineViewPosterX under a unique name; do not alter image PosterX packages.\nlog 'CineViewPosterX=BUILTIN'\n",
              s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('PosterX smartdeps block not found')
          p.write_text(s)
          PY
          tar -C /tmp/cvstage -czf /tmp/cineview-payload.tar.gz .
          OUT=/tmp/cineview-smart-install.sh
          cat installer/parts/0000-header.sh > "$OUT"
          base64 -w 76 /tmp/cineview-payload.tar.gz >> "$OUT"
          LINE=$(awk '/^__CINEVIEW_PAYLOAD_BELOW__$/{print NR+1; exit}' "$OUT")
          test -n "$LINE"
          tail -n +"$LINE" "$OUT" | base64 -d > /tmp/cineview-payload-check.tar.gz
          tar -tzf /tmp/cineview-payload-check.tar.gz >/dev/null
          tar -xOf /tmp/cineview-payload-check.tar.gz ./usr/lib/enigma2/python/Components/Renderer/CineViewPosterX.py | grep -q 'class CineViewPosterX'
          tar -xOf /tmp/cineview-payload-check.tar.gz ./usr/lib/enigma2/python/Plugins/Extensions/CineViewControl/openbh_compat.py | grep -q 'InfoBarGridEPG'
          mv "$OUT" cineview-smart-install.sh
          chmod 755 cineview-smart-install.sh
      - name: Commit rebuilt installer
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- cineview-smart-install.sh; then
            echo "Installer already current"
            exit 0
          fi
          git config user.name "CineView Builder"
          git config user.email "actions@users.noreply.github.com"
          git add cineview-smart-install.sh
          git commit -m "build: regenerate smart installer"
          git push
