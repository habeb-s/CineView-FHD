name: Build CineView smart installer
on:
  push:
    paths:
      - 'installer/parts/**'
      - 'installer/CineViewPosterX.py'
      - 'installer/openbh_compat.py'
      - 'installer/openatv_compat.py'
      - 'tools/validate_openbh_atv_parity.py'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild and validate installer
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/cvstage
          mkdir -p /tmp/cvstage
          cat installer/parts/*.b64 | base64 -d > /tmp/cineview-payload-original.tar.gz
          tar -xzf /tmp/cineview-payload-original.tar.gz -C /tmp/cvstage
          mkdir -p /tmp/cvstage/usr/lib/enigma2/python/Components/Renderer
          cp -f installer/CineViewPosterX.py /tmp/cvstage/usr/lib/enigma2/python/Components/Renderer/CineViewPosterX.py
          cp -f installer/openbh_compat.py /tmp/cvstage/usr/lib/enigma2/python/Plugins/Extensions/CineViewControl/openbh_compat.py
          cp -f installer/openatv_compat.py /tmp/cvstage/usr/lib/enigma2/python/Plugins/Extensions/CineViewControl/openatv_compat.py
          python3 -m py_compile /tmp/cvstage/usr/lib/enigma2/python/Components/Renderer/CineViewPosterX.py
          python3 -m py_compile /tmp/cvstage/usr/lib/enigma2/python/Plugins/Extensions/CineViewControl/openbh_compat.py
          python3 -m py_compile /tmp/cvstage/usr/lib/enigma2/python/Plugins/Extensions/CineViewControl/openatv_compat.py

          # Compare the same payload after OpenATV vs OpenBH adaptation.
          # This is report-only during the porting branch; strict mode is enabled
          # once all shared screen geometries are aligned.
          python3 tools/validate_openbh_atv_parity.py \
            --skin-dir /tmp/cvstage/usr/share/enigma2/CineView_FHD \
            --openatv-adapter installer/openatv_compat.py \
            --openbh-adapter installer/openbh_compat.py \
            --report /tmp/openbh-atv-parity.json
          cat /tmp/openbh-atv-parity.json

          rm -rf /tmp/cvstage/usr/lib/enigma2/python/Components/Renderer/__pycache__
          rm -rf /tmp/cvstage/usr/lib/enigma2/python/Plugins/Extensions/CineViewControl/__pycache__

          # CineView owns its poster renderer on every image. Do not depend on
          # image-specific PosterX packages or overwrite files owned by them.
          python3 - <<'PY'
          from pathlib import Path
          skin=Path('/tmp/cvstage/usr/share/enigma2/CineView_FHD')
          count=0
          for p in skin.glob('skin*.xml'):
              s=p.read_text(errors='ignore')
              ns=s.replace('render="PosterX"','render="CineViewPosterX"').replace("render='PosterX'","render='CineViewPosterX'")
              if ns != s:
                  p.write_text(ns)
                  count += 1
          plug=Path('/tmp/cvstage/usr/lib/enigma2/python/Plugins/Extensions/CineViewControl')
          for name in ('activate.sh','plugin.py'):
              p=plug/name
              s=p.read_text(errors='ignore')
              s=s.replace('/Components/Renderer/PosterX','/Components/Renderer/CineViewPosterX')
              p.write_text(s)
          print('CineViewPosterX layouts patched:',count)
          PY

          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('/tmp/cvstage/usr/lib/enigma2/python/Plugins/Extensions/CineViewControl/smartdeps.sh')
          s=p.read_text()
          if "CineViewPosterX=BUILTIN" not in s:
              s,n=re.subn(
                  r'# PosterX: prefer a dedicated feed package\. Never force-install unrelated packages\..*?\nfi\n',
                  "# PosterX: CineView ships CineViewPosterX under a unique name; do not alter image PosterX packages.\nlog 'CineViewPosterX=BUILTIN'\n",
                  s, count=1, flags=re.S)
              if n != 1:
                  raise SystemExit('PosterX smartdeps block not found or recognized')
              p.write_text(s)
          PY
          tar -C /tmp/cvstage -czf /tmp/cineview-payload.tar.gz .
          OUT=/tmp/cineview-smart-install.sh
          cat installer/parts/0000-header.sh > "$OUT"
          base64 -w 76 /tmp/cineview-payload.tar.gz >> "$OUT"
          LINE=$(awk '/^__CINEVIEW_PAYLOAD_BELOW__$/{print NR+1; exit}' "$OUT")
          test -n "$LINE"
          tail -n +"$LINE" "$OUT" | base64 -d > /tmp/cineview-payload-check.tar.gz
          tar -tzf /tmp/cineview-payload-check.tar.gz >/dev/null
          tar -xOf /tmp/cineview-payload-check.tar.gz ./usr/lib/enigma2/python/Components/Renderer/CineViewPosterX.py > /tmp/check-CineViewPosterX.py
          tar -xOf /tmp/cineview-payload-check.tar.gz ./usr/lib/enigma2/python/Plugins/Extensions/CineViewControl/openbh_compat.py > /tmp/check-openbh_compat.py
          tar -xOf /tmp/cineview-payload-check.tar.gz ./usr/lib/enigma2/python/Plugins/Extensions/CineViewControl/openatv_compat.py > /tmp/check-openatv_compat.py
          tar -xOf /tmp/cineview-payload-check.tar.gz ./usr/lib/enigma2/python/Plugins/Extensions/CineViewControl/activate.sh > /tmp/check-activate.sh
          tar -xOf /tmp/cineview-payload-check.tar.gz ./usr/lib/enigma2/python/Plugins/Extensions/CineViewControl/plugin.py > /tmp/check-plugin.py
          grep -q 'class CineViewPosterX' /tmp/check-CineViewPosterX.py
          grep -q 'DeliteGreenPanel' /tmp/check-openbh_compat.py
          grep -q 'DeliteSetupFp' /tmp/check-openbh_compat.py
          grep -q 'BT_SCALE' /tmp/check-openbh_compat.py
          grep -q 'PluginBrowserList' /tmp/check-openatv_compat.py
          grep -q 'source="pluginList"' /tmp/check-openatv_compat.py
          grep -q 'PluginBrowserGrid' /tmp/check-openatv_compat.py
          grep -q 'source="pluginGrid"' /tmp/check-openatv_compat.py
          grep -q 'SecondInfoBarECM' /tmp/check-openatv_compat.py
          grep -q 'GraphicalInfoBarEPG' /tmp/check-openatv_compat.py
          grep -q 'Renderer/CineViewPosterX' /tmp/check-activate.sh
          grep -q 'Renderer/CineViewPosterX' /tmp/check-plugin.py
          rm -rf /tmp/cvcheck && mkdir -p /tmp/cvcheck
          tar -xzf /tmp/cineview-payload-check.tar.gz -C /tmp/cvcheck
          if grep -R -q 'render="PosterX"' /tmp/cvcheck/usr/share/enigma2/CineView_FHD/skin*.xml; then
            echo "Legacy PosterX renderer reference remains" >&2
            exit 1
          fi
          mv "$OUT" cineview-smart-install.sh
          chmod 755 cineview-smart-install.sh
      - name: Commit rebuilt installer
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- cineview-smart-install.sh; then
            echo "Installer already current"
            exit 0
          fi
          git config user.name "CineView Builder"
          git config user.email "actions@users.noreply.github.com"
          git add cineview-smart-install.sh
          git commit -m "build: regenerate smart installer"
          git push
