name: Validate final public OpenBH installer
on:
  push:
    paths:
      - '.github/workflows/inspect-cineview.yml'
      - 'install.sh'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run exact public bootstrap and install actual package data
        shell: bash
        run: |
          set -euo pipefail
          PIN=$(sed -n 's|^RAW="https://raw.githubusercontent.com/habeb-s/CineView-FHD/\([0-9a-f]\{40\}\)"|\1|p' install.sh)
          test -n "$PIN"
          echo "BOOTSTRAP_PIN=$PIN"

          sudo mkdir -p /etc/enigma2 /usr/local/bin
          printf '%s\n' 'Creator=OpenBH' 'Version=6.0' 'Build=001' 'distro=openbh' | sudo tee /etc/image-version >/dev/null
          sudo tee /etc/enigma2/settings >/dev/null <<'EOF'
          config.plugins.cineview.theme=green
          config.plugins.cineview.poster_infobar=True
          config.plugins.cineview.poster_second=True
          config.plugins.cineview.poster_channels=True
          config.plugins.cineview.weatherprovider=oa
          config.plugins.cineview.timeformat=24
          EOF

          cat > /tmp/opkg <<'EOF'
          #!/bin/sh
          echo "$*" >> /tmp/opkg-calls.log
          pkg=""
          for a in "$@"; do case "$a" in /tmp/cineview-fhd-*.ipk) pkg="$a";; esac; done
          [ -n "$pkg" ] || exit 0
          if echo " $* " | grep -q " --force-reinstall "; then
            rm -rf /tmp/ipkx && mkdir -p /tmp/ipkx
            cd /tmp/ipkx || exit 1
            ar p "$pkg" data.tar.gz > data.tar.gz || exit 1
            sudo tar -xzf data.tar.gz -C / || exit 1
            touch /tmp/public-data-installed
            exit 0
          fi
          echo "Refusing first same-version install (simulated OpenBH)" >&2
          exit 1
          EOF
          chmod +x /tmp/opkg
          sudo cp /tmp/opkg /usr/local/bin/opkg

          cp install.sh /tmp/public-install.sh
          sed -i 's/--restart/--no-restart/g' /tmp/public-install.sh
          sudo env PATH="/usr/local/bin:/usr/bin:/bin" sh /tmp/public-install.sh 2>&1 | tee /tmp/public.log

          test -f /tmp/public-data-installed
          grep -F 'Profile: oealliance/openbh' /tmp/public.log
          grep -F -- '--force-reinstall' /tmp/opkg-calls.log
          grep -F 'CineViewPosterX is embedded for OpenBH' /tmp/public.log
          grep -F 'installation complete' /tmp/public.log
          grep -F 'Installer file removed' /tmp/public.log

      - name: Verify final active skin is the photographed-screen repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, xml.etree.ElementTree as ET
          p='/usr/share/enigma2/CineView_FHD/skin.xml'
          s=open(p,errors='ignore').read()
          ET.parse(p)
          def one(name):
              ms=list(re.finditer(r'<screen\b(?=[^>]*\bname=["\']'+re.escape(name)+r'["\'])[^>]*>',s))
              assert len(ms)==1,(name,len(ms))
              e=s.find('</screen>',ms[0].start())
              return s[ms[0].start():e+9]
          ev=one('EventView')
          gp=one('DeliteGreenPanel')
          bp=one('DeliteBluePanel')
          fp=one('DeliteSetupFp')
          gs=one('BhSetupGreen')

          required_ev=('name="channel"','name="epg_eventname"','name="datetime"','name="duration"','name="FullDescription"','name="key_green"','name="key_yellow"','name="key_blue"','render="CineViewPosterX"')
          required_gp=('source="list"','render="Listbox"','name="key_red"','name="key_green"','name="key_yellow"','name="key_blue"')
          required_bp=('name="list"','name="lab1"','name="lab2"','name="activecam"','name="Ilab1"','name="Ilab2"','name="Ilab3"','name="Ilab4"','name="Ecmtext"')
          for x in required_ev: assert x in ev,('EventView',x)
          for x in required_gp: assert x in gp,('GreenPanel',x)
          for x in required_bp: assert x in bp,('BluePanel',x)
          for x in ('BT_SCALE','png = 2','itemHeight": 80'): assert x in fp,('FastPluginSetup',x)
          for x in ('BT_SCALE','png = 1','itemHeight": 68'): assert x in gs,('GreenPanelSetup',x)
          assert 'BT_SCALE' in gp

          assert 'render="PosterX"' not in s
          assert s.count('render="CineViewPosterX"') >= 10
          print('PUBLIC_FINAL_EVENTVIEW_OK')
          print('PUBLIC_FINAL_GREEN_PANEL_OK')
          print('PUBLIC_FINAL_BLUE_PANEL_OK')
          print('PUBLIC_FAST_PLUGIN_ICONS_SCALE_OK')
          print('PUBLIC_GREEN_SETUP_ICONS_SCALE_OK')
          print('PUBLIC_FINAL_CINEVIEWPOSTERX_REFS',s.count('render="CineViewPosterX"'))
          PY
          grep -q 'Renderer/CineViewPosterX' /usr/lib/enigma2/python/Plugins/Extensions/CineViewControl/activate.sh
          grep -q 'API_IMDB' /usr/lib/enigma2/python/Components/Renderer/CineViewPosterX.py
          echo 'PUBLIC_FINAL_ACTIVATION_OK'

      - name: Verify exact photographed movie artwork source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.parse, urllib.request
          title='Więzień labiryntu: Lęk na śmierć'
          u='https://v3.sg.media-imdb.com/suggestion/x/%s.json'%urllib.parse.quote(title)
          req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0 CineView-FHD'})
          data=json.loads(urllib.request.urlopen(req,timeout=12).read().decode('utf-8'))
          rows=[r for r in (data.get('d') or []) if str(r.get('id') or '').startswith('tt') and (r.get('i') or {}).get('imageUrl')]
          assert rows
          row=rows[0]
          assert row.get('id')=='tt4500922',row
          req=urllib.request.Request(row['i']['imageUrl'],headers={'User-Agent':'Mozilla/5.0 CineView-FHD'})
          body=urllib.request.urlopen(req,timeout=15).read()
          assert len(body)>1500,len(body)
          print('PUBLIC_EXACT_MOVIE_POSTER_OK',row.get('id'),row.get('l'),len(body))
          PY
          echo 'PUBLIC_OPENBH_BOOTSTRAP_AND_CONTENT_VALIDATED'
