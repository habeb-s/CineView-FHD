name: Inspect real failing OpenBH screens
on:
  push:
    paths:
      - '.github/workflows/inspect-cineview.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build final OpenBH skin and print photographed screens
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/cv /tmp/skin && mkdir -p /tmp/cv /tmp/skin
          LINE=$(awk '/^__CINEVIEW_PAYLOAD_BELOW__$/{print NR+1; exit}' cineview-smart-install.sh)
          tail -n +"$LINE" cineview-smart-install.sh | base64 -d > /tmp/cv/payload.tar.gz
          tar -xzf /tmp/cv/payload.tar.gz -C /tmp/cv
          ROOT=/tmp/cv/usr/share/enigma2/CineView_FHD
          PLUG=/tmp/cv/usr/lib/enigma2/python/Plugins/Extensions/CineViewControl
          cp "$ROOT"/skin*.xml /tmp/skin/
          python3 "$PLUG/openbh_compat.py" /tmp/skin
          cp /tmp/skin/skin.layout-111-none.xml /tmp/final.xml
          python3 "$PLUG/theme.py" /tmp/skin green >/dev/null || true
          cp /tmp/skin/skin.layout-111-none.xml /tmp/final.xml
          python3 - <<'PY'
          import re
          s=open('/tmp/final.xml',errors='ignore').read()
          for n in ('EventView','DeliteGreenPanel','DeliteBluePanel','PluginBrowser','InfoBar','SecondInfoBar'):
              ms=list(re.finditer(r'<screen\b(?=[^>]*\bname=["\']'+re.escape(n)+r'["\'])[^>]*>',s))
              print('\n### %s count=%d ###'%(n,len(ms)))
              for m in ms:
                  e=s.find('</screen>',m.start())
                  print(s[m.start():e+9][:12000])
          PY
