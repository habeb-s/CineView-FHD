name: Validate public OpenBH bootstrap
on:
  push:
    paths:
      - '.github/workflows/inspect-cineview.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run exact public bootstrap path
        shell: bash
        run: |
          set -euo pipefail
          sudo mkdir -p /etc/enigma2 /usr/local/bin
          printf '%s\n' 'Creator=OpenBH' 'Version=6.0' 'Build=001' 'distro=openbh' | sudo tee /etc/image-version >/dev/null

          cat > /tmp/opkg <<'EOF'
          #!/bin/sh
          echo "$*" >> /tmp/opkg-calls.log
          case "$*" in
            *"/tmp/cineview-fhd-"*".ipk"*)
              if echo " $* " | grep -q " --force-reinstall "; then
                touch /tmp/force-reinstall-used
                exit 0
              fi
              echo "Refusing same-version install (simulated)" >&2
              exit 1
              ;;
            *) exit 0 ;;
          esac
          EOF
          chmod +x /tmp/opkg
          sudo cp /tmp/opkg /usr/local/bin/opkg

          cp install.sh /tmp/public-install.sh
          sed -i 's/--restart/--no-restart/g' /tmp/public-install.sh
          sudo env PATH="/usr/local/bin:/usr/bin:/bin" sh /tmp/public-install.sh 2>&1 | tee /tmp/public.log

          test -f /tmp/force-reinstall-used
          grep -F 'Profile: oealliance/openbh' /tmp/public.log
          grep -F 'CineViewPosterX is embedded for OpenBH' /tmp/public.log
          grep -F 'validated 34 XML files' /tmp/public.log
          grep -F 'installed successfully' /tmp/public.log
          grep -F 'installation complete' /tmp/public.log
          grep -F 'Installer file removed' /tmp/public.log
          echo 'PUBLIC_OPENBH_BOOTSTRAP_OK'
