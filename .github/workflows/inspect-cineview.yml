name: Validate OpenViX CineView repair
on:
  push:
    paths:
      - '.github/workflows/inspect-cineview.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell syntax
        run: sh -n cineview-smart-install.sh
      - name: Simulate OpenViX dry run
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' 'Creator=OpenViX' 'Version=6.9' 'Build=002' 'distro=openvix' | sudo tee /etc/image-version >/dev/null
          sudo /bin/sh ./cineview-smart-install.sh --dry-run | tee /tmp/cineview-dry.log
          grep -F "OpenViX detected -> applying stable native PluginBrowser list binding" /tmp/cineview-dry.log
          grep -F "OpenViX PluginBrowser switched to native classic list mode" /tmp/cineview-dry.log
          grep -F "Dry-run passed" /tmp/cineview-dry.log
