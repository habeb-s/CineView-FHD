name: Inspect CineView original OpenBH screens
on:
  push:
    paths:
      - '.github/workflows/inspect-cineview.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract original payload screens
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/cv && mkdir -p /tmp/cv
          cat installer/parts/*.b64 | base64 -d > /tmp/payload.tar.gz
          tar -xzf /tmp/payload.tar.gz -C /tmp/cv
          P=/tmp/cv/usr/share/enigma2/CineView_FHD/skin.layout-000-oa.xml
          python3 - "$P" <<'PY'
          import re,sys
          s=open(sys.argv[1],errors='ignore').read()
          for name in ['ChoiceBox','PluginBrowser','EPGSelection','EPGSelectionMulti','QuickEPG','GraphicalEPG','GraphicalEPGPIG','GraphicalInfoBarEPG']:
              print('\n###',name,'###')
              ms=list(re.finditer(r'<screen\b(?=[^>]*\bname="'+re.escape(name)+r'")[^>]*>',s))
              print('count=',len(ms))
              for m in ms:
                  e=s.find('</screen>',m.start())
                  print(s[m.start():e+9])
          PY
