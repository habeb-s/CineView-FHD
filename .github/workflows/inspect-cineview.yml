name: Inspect CineView compat
on:
  push:
    paths:
      - '.github/workflows/inspect-cineview.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect compatibility logic
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/cv
          cat installer/parts/*.b64 | base64 -d > /tmp/cv/payload.tar.gz
          tar -xzf /tmp/cv/payload.tar.gz -C /tmp/cv
          P=/tmp/cv/usr/lib/enigma2/python/Plugins/Extensions/CineViewControl/compat.py
          echo '=== COMPAT FULL ==='
          sed -n '1,260p' "$P"
