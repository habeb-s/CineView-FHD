name: Inspect installed CineView activation path
on:
  push:
    paths:
      - '.github/workflows/inspect-cineview.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect embedded activation/runtime files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/cv && mkdir -p /tmp/cv
          LINE=$(awk '/^__CINEVIEW_PAYLOAD_BELOW__$/{print NR+1; exit}' cineview-smart-install.sh)
          tail -n +"$LINE" cineview-smart-install.sh | base64 -d > /tmp/cv/payload.tar.gz
          tar -xzf /tmp/cv/payload.tar.gz -C /tmp/cv

          echo '=== PAYLOAD TOP LEVEL SKIN FILES ==='
          find /tmp/cv/usr/share/enigma2/CineView_FHD -maxdepth 1 -type f -printf '%f\n' | sort

          echo '=== ACTIVATE.SH ==='
          sed -n '1,320p' /tmp/cv/usr/lib/enigma2/python/Plugins/Extensions/CineViewControl/activate.sh || true

          echo '=== PLUGIN PY RUNTIME REFERENCES ==='
          grep -R -n -E 'skin\.xml|skin\.layout|skin\.theme|copy|cp |shutil|theme|primary_skin|activate' /tmp/cv/usr/lib/enigma2/python/Plugins/Extensions/CineViewControl | head -n 500 || true

          echo '=== SKIN.XML TARGET SCREENS ==='
          python3 - <<'PY'
          import re
          p='/tmp/cv/usr/share/enigma2/CineView_FHD/skin.xml'
          s=open(p,errors='ignore').read()
          print('skin.xml bytes',len(s))
          for name in ['InfoBar','SecondInfoBar','ChoiceBox','PluginBrowser','EPGSelection','EPGSelectionMulti','QuickEPG','GraphicalEPG','GraphicalEPGPIG','GraphicalInfoBarEPG','SingleEPG','GridEPG']:
              ms=list(re.finditer(r'<screen\b(?=[^>]*\bname=["\']'+re.escape(name)+r'["\'])[^>]*>',s))
              print(name,'count',len(ms))
              for m in ms[:2]:
                  e=s.find('</screen>',m.start())
                  print(s[m.start():e+9][:5000])
          PY

          echo '=== SETTINGS/CONFIG NAMES ==='
          grep -R -n -E 'config\.plugins\.cineview|theme|layout' /tmp/cv/usr/lib/enigma2/python/Plugins/Extensions/CineViewControl | head -n 500 || true
