name: Inspect CineView payload
on:
  push:
    paths:
      - '.github/workflows/inspect-cineview.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract payload and inspect plugin screens
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/cv
          cat installer/parts/*.b64 > /tmp/cv/payload.b64
          base64 -d /tmp/cv/payload.b64 > /tmp/cv/payload.tar.gz
          tar -xzf /tmp/cv/payload.tar.gz -C /tmp/cv
          echo '=== PAYLOAD FILES ==='
          find /tmp/cv/usr/share/enigma2/CineView_FHD -maxdepth 2 -type f | sort
          echo '=== PLUGIN-RELATED SCREEN DEFINITIONS ==='
          grep -Rni -E '<screen[^>]+name="[^"]*(Plugin|plugin)[^"]*"' /tmp/cv/usr/share/enigma2/CineView_FHD || true
          echo '=== PLUGINBROWSER CONTEXT ==='
          python3 - <<'PY'
          import pathlib,re
          root=pathlib.Path('/tmp/cv/usr/share/enigma2/CineView_FHD')
          for p in root.rglob('*.xml'):
              s=p.read_text(errors='ignore')
              for m in re.finditer(r'<screen\b[^>]*\bname="[^"]*(?:Plugin|plugin)[^"]*"[^>]*>', s):
                  st=m.start()
                  end=s.find('</screen>', st)
                  if end < 0: end=min(len(s), st+5000)
                  else: end += len('</screen>')
                  print('\n---',p,'---')
                  print(s[st:end][:7000])
          PY
          echo '=== COMPAT SCRIPT PLUGIN REFERENCES ==='
          grep -Rni -E 'PluginBrowser|PluginDownload|plugin.*screen|screen.*plugin' /tmp/cv/usr/lib/enigma2/python/Plugins/Extensions/CineViewControl || true
