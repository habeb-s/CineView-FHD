name: Validate photographed OpenBH screens
on:
  push:
    paths:
      - '.github/workflows/inspect-cineview.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install latest package data and validate exact screens
        shell: bash
        run: |
          set -euo pipefail
          sudo mkdir -p /etc/enigma2 /usr/local/bin
          printf '%s\n' 'Creator=OpenBH' 'Version=6.0' 'Build=001' 'distro=openbh' | sudo tee /etc/image-version >/dev/null
          sudo tee /etc/enigma2/settings >/dev/null <<'EOF'
          config.plugins.cineview.theme=green
          config.plugins.cineview.poster_infobar=True
          config.plugins.cineview.poster_second=True
          config.plugins.cineview.poster_channels=True
          config.plugins.cineview.weatherprovider=oa
          config.plugins.cineview.timeformat=24
          EOF

          cat > /tmp/opkg <<'EOF'
          #!/bin/sh
          pkg=""
          for a in "$@"; do case "$a" in /tmp/cineview-fhd-*.ipk) pkg="$a";; esac; done
          [ -n "$pkg" ] || exit 0
          if echo " $* " | grep -q " --force-reinstall "; then
            rm -rf /tmp/ipkx && mkdir -p /tmp/ipkx
            cd /tmp/ipkx || exit 1
            ar p "$pkg" data.tar.gz > data.tar.gz || exit 1
            sudo tar -xzf data.tar.gz -C / || exit 1
            touch /tmp/data-installed
            exit 0
          fi
          exit 1
          EOF
          chmod +x /tmp/opkg
          sudo cp /tmp/opkg /usr/local/bin/opkg

          cp cineview-smart-install.sh /tmp/cv-install.sh
          sudo env PATH="/usr/local/bin:/usr/bin:/bin" sh /tmp/cv-install.sh --no-restart >/tmp/install.log 2>&1
          test -f /tmp/data-installed

          python3 - <<'PY'
          import re, xml.etree.ElementTree as ET
          p='/usr/share/enigma2/CineView_FHD/skin.xml'
          s=open(p,errors='ignore').read()
          ET.parse(p)

          def one(name):
              ms=list(re.finditer(r'<screen\b(?=[^>]*\bname=["\']'+re.escape(name)+r'["\'])[^>]*>',s))
              assert len(ms)==1,(name,len(ms))
              e=s.find('</screen>',ms[0].start())
              return s[ms[0].start():e+9]

          ev=one('EventView')
          gp=one('DeliteGreenPanel')
          bp=one('DeliteBluePanel')

          for token in ('name="channel"','name="datetime"','name="duration"','name="FullDescription"','name="epg_eventname"','name="key_green"','name="key_yellow"','name="key_blue"','render="CineViewPosterX"'):
              assert token in ev,('EventView missing',token)

          for token in ('source="list"','render="Listbox"','name="key_red"','name="key_green"','name="key_yellow"','name="key_blue"'):
              assert token in gp,('GreenPanel missing',token)

          for token in ('name="list"','name="lab1"','name="lab2"','name="activecam"','name="Ilab1"','name="Ilab2"','name="Ilab3"','name="Ilab4"','name="Ecmtext"'):
              assert token in bp,('BluePanel missing',token)

          assert 'render="PosterX"' not in s
          assert s.count('render="CineViewPosterX"') > 0
          print('EVENTVIEW_OK')
          print('GREEN_PANEL_OK')
          print('BLUE_PANEL_OK')
          print('FINAL_CINEVIEWPOSTERX_REFS',s.count('render="CineViewPosterX"'))
          PY

          grep -q 'Renderer/CineViewPosterX' /usr/lib/enigma2/python/Plugins/Extensions/CineViewControl/activate.sh
          grep -q 'Renderer/CineViewPosterX' /usr/lib/enigma2/python/Plugins/Extensions/CineViewControl/plugin.py
          test -f /usr/lib/enigma2/python/Components/Renderer/CineViewPosterX.py
          echo 'ACTIVATION_USES_CINEVIEWPOSTERX'

      - name: Test artwork lookup with the movie visible in user screenshot
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.parse, urllib.request
          titles=[
              'Więzień labiryntu: Lek na śmierć',
              'Więzień labiryntu: Lęk na śmierć',
              'Więzień labiryntu'
          ]
          found=None
          for title in titles:
              for country in ('PL','US','GB','DE'):
                  q=urllib.parse.urlencode({'term':title,'media':'movie','entity':'movie','limit':5,'country':country})
                  req=urllib.request.Request('https://itunes.apple.com/search?'+q,headers={'User-Agent':'CineView-FHD-validation'})
                  data=json.loads(urllib.request.urlopen(req,timeout=12).read().decode('utf-8'))
                  if data.get('results'):
                      row=data['results'][0]
                      found=(title,country,row.get('trackName'),row.get('artworkUrl100'))
                      break
              if found: break
          if not found:
              raise SystemExit('MOVIE_ARTWORK_LOOKUP_FAILED')
          title,country,name,url=found
          print('MOVIE_LOOKUP_OK',title,country,name,url)
          url=url.replace('/100x100bb.','/600x900bb.')
          req=urllib.request.Request(url,headers={'User-Agent':'CineView-FHD-validation'})
          body=urllib.request.urlopen(req,timeout=15).read()
          if len(body) < 1500:
              raise SystemExit('MOVIE_ARTWORK_DOWNLOAD_TOO_SMALL')
          print('MOVIE_ARTWORK_DOWNLOAD_OK bytes=%d'%len(body))
          PY
