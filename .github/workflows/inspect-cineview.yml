name: Probe no-key movie poster sources
on:
  push:
    paths:
      - '.github/workflows/inspect-cineview.yml'
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe IMDb suggestion with photographed EPG title
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.parse, urllib.request, unicodedata, re
          titles=[
              'Więzień labiryntu: Lek na śmierć',
              'Więzień labiryntu: Lęk na śmierć',
              'Więzień labiryntu'
          ]
          for title in titles:
              q=urllib.parse.quote(title)
              urls=[
                  'https://v3.sg.media-imdb.com/suggestion/x/%s.json'%q,
                  'https://v2.sg.media-imdb.com/suggestion/x/%s.json'%q,
              ]
              for u in urls:
                  try:
                      req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0 CineView-FHD'})
                      data=json.loads(urllib.request.urlopen(req,timeout=12).read().decode('utf-8'))
                      print('TITLE',title,'URL',u,'COUNT',len(data.get('d') or []))
                      for row in (data.get('d') or [])[:5]:
                          print('ROW',row.get('id'),row.get('l'),(row.get('i') or {}).get('imageUrl'))
                  except Exception as e:
                      print('ERR',u,repr(e))
          PY
